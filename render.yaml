# render.yaml — Render Blueprint for CertiVault on the FREE plan.
# Step-by-step guide: docs/13_DEPLOY_RENDER.md
#
# Render dashboard → New → Blueprint → connect this repository. Render asks
# for every "sync: false" value once; the three secrets marked
# "generateValue: true" are created randomly by Render (keep them: changing
# CV_ENCRYPTION_KEY later makes existing institution keys undecryptable).
#
# Free-plan facts this setup is built around: no outbound SMTP (mail goes
# through the Brevo HTTPS API), an ephemeral disk (files are mirrored into
# the database: CV_FILE_STORE=db), no shell (schema + super admin are
# created at start-up by scripts/render_boot.php), TLS terminated by
# Render's proxy (CV_TRUST_PROXY=1), and the service sleeps after 15 idle
# minutes (point an uptime monitor at /health.php).
services:
  - type: web
    name: certivault
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health.php
    envVars:
      # ── fixed settings ──────────────────────────────────────────────
      - key: CV_ENV
        value: production
      - key: CV_TRUST_PROXY
        value: "1"
      - key: CV_FILE_STORE
        value: db
      - key: CV_MAIL_TRANSPORT
        value: brevo
      - key: CV_ERROR_LOG
        value: stderr
      # ── secrets generated by Render (256-bit random, base64) ────────
      - key: CV_ENCRYPTION_KEY
        generateValue: true
      - key: CV_OTP_PEPPER
        generateValue: true
      - key: CV_SHARE_SECRET
        generateValue: true
      # ── values you enter when creating the Blueprint ────────────────
      - key: CV_DB_HOST          # e.g. mysql-xxxx.aivencloud.com
        sync: false
      - key: CV_DB_PORT          # e.g. 12345 (Aiven uses a non-3306 port)
        sync: false
      - key: CV_DB_USER          # e.g. avnadmin
        sync: false
      - key: CV_DB_PASS
        sync: false
      - key: CV_DB_NAME          # e.g. defaultdb
        sync: false
      - key: CV_DB_SSL_CA_PEM    # Aiven: full text of ca.pem. TiDB Cloud: leave empty and use CV_DB_SSL_CA below
        sync: false
      - key: CV_DB_SSL_CA        # TiDB Cloud: /etc/ssl/certs/ca-certificates.crt
        sync: false
      - key: CV_BREVO_API_KEY    # Brevo → SMTP & API → API keys
        sync: false
      - key: CV_MAIL_FROM_EMAIL  # a sender address verified in Brevo
        sync: false
      - key: CV_BASE_URL         # https://<your-service>.onrender.com
        sync: false
      - key: CV_SUPER_ADMIN_EMAIL
        sync: false
      - key: CV_SUPER_ADMIN_PASSWORD   # 8-72 chars, upper + lower + digit + special
        sync: false
