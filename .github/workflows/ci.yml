# Continuous integration for CertiVault.
# Runs on every push and pull request:
#   1. php     — lint every first-party PHP file + the full CLI suite
#                (tests/run_all.php) against a MariaDB service container
#   2. browser — the headless-Chrome suites (Smart Verify + whole-app CSP audit)
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CV_DB_HOST: 127.0.0.1
  CV_DB_USER: root
  CV_DB_PASS: ci-root-password
  CV_TEST_DB: certivault_test
  # Guest free-verification quota off for every php -S the suites start
  # (they verify as guests many times on purpose). tests/test_guest_quota.php
  # sets its own limit explicitly, so the quota itself is still covered.
  CV_GUEST_VERIFY_LIMIT: '0'

jobs:
  php:
    name: PHP suite (lint + run_all)
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci-root-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, openssl, gd, fileinfo, mbstring, curl, zip
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist

      - name: Lint first-party PHP
        run: |
          git ls-files '*.php' | grep -v -e '^src/utils/phpqrcode/' -e '^src/utils/PHPMailer/' -e '^src/utils/qrdecoder/' \
            | xargs -n1 -P4 php -l > /tmp/lint.txt || { grep -v '^No syntax errors' /tmp/lint.txt; exit 1; }
          echo "Linted $(wc -l < /tmp/lint.txt) files."

      - name: Run the CLI test suite
        run: |
          set -o pipefail
          php tests/run_all.php 2>&1 | tee /tmp/suite.txt

      - name: Summarise failures as an annotation
        if: failure()
        run: |
          msg=$( { grep -E '^(FAIL|SKIP|PHP (Fatal|Parse|Warning)|Fatal|===== |--- )' /tmp/suite.txt || true;                    echo '--- php_errors.log (tail) ---'; tail -n 25 private_data/php_errors.log 2>/dev/null || true; }                  | head -n 120 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=CLI suite failures::${msg}"

  browser:
    name: Browser suite (headless Chrome)
    runs-on: ubuntu-24.04
    needs: php
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci-root-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      CV_CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, openssl, gd, fileinfo, mbstring, curl, zip
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Composer dependencies
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist

      - name: Create the test database
        run: php tests/support/ui_db.php reset-limiter

      - name: Smart Verify in the browser
        run: |
          set -o pipefail
          node tests/test_verify_ui.mjs 2>&1 | tee /tmp/ui.txt

      - name: Whole-app CSP audit
        run: |
          set -o pipefail
          node tests/test_pages_browser.mjs 2>&1 | tee /tmp/pages.txt

      - name: Summarise failures as an annotation
        if: failure()
        run: |
          msg=$( { cat /tmp/ui.txt /tmp/pages.txt 2>/dev/null | grep -E '^(FAIL|SKIP)|summary|fatal' || true; }                  | head -n 120 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Browser suite failures::${msg}"

  docker:
    name: Docker image (build + smoke test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack
        run: docker compose up -d --build --wait

      - name: Seed demo data and verify a certificate
        run: |
          docker compose exec -T -u www-data app php scripts/seed_demo.php
          for i in $(seq 1 30); do code=$(curl -s -o /tmp/home.html -w '%{http_code}' http://localhost:8080/); [ "$code" = 200 ] && break; sleep 1; done
          echo "home: $code"; test "$code" = 200
          test "$(curl -s http://localhost:8080/health.php)" = ok
          curl -s "http://localhost:8080/verify.php?certificate_id=CV-$(date +%Y)-000001" | grep -q 'verdict-seal-valid'
          curl -s "http://localhost:8080/api_status.php?certificate_id=CV-$(date +%Y)-000003" | grep -q '"REVOKED"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/../src/config/config.php)" != 200
          docker compose exec -T -u www-data app php scripts/pin_institution_keys.php --verify

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 80
